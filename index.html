<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chace 'N' Vapes | Baker, MT Premium Smoke & Glass</title>
    <style>
        :root {
            --primary: #0f0f0f;
            --accent: #d4af37; /* Gold for a premium, heritage feel */
            --text: #ffffff;
            --bg-overlay: rgba(0, 0, 0, 0.65);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--primary);
            color: var(--text);
            scroll-behavior: smooth;
        }

        /* Parallax Scenery Engine */
        .scenery-layer {
            height: 100vh;
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay);
            z-index: 1;
        }

        .content {
            z-index: 2;
            padding: 20px;
            max-width: 900px;
        }

        h1 { font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: 6px; margin-bottom: 10px; text-transform: uppercase; font-weight: 900; }
        h2 { font-size: 3rem; color: var(--accent); margin-bottom: 20px; }
        p { font-size: 1.2rem; line-height: 1.8; opacity: 0.9; max-width: 700px; margin: 0 auto; }

        /* Scenery Transitions: Representing the Baker/Montana Landscape */
        .hero { background-image: url('https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1920&q=80'); } /* Badlands/Plains */
        .glass { background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80'); } /* High Peaks */
        .vape { background-image: url('https://images.unsplash.com/photo-1493246507139-91e8bef99c02?auto=format&fit=crop&w=1920&q=80'); } /* Twilight Horizon */
        .kratom { background-image: url('https://images.unsplash.com/photo-1500673922987-e212871fec22?auto=format&fit=crop&w=1920&q=80'); } /* Forest Moss */

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border: 1px solid var(--accent);
        }

        .product-card h3 { color: var(--accent); text-transform: uppercase
